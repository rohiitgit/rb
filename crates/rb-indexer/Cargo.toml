[package]
name = "rb-indexer"
description = "Repository Brain indexing pipeline: git → structure → snapshot graph (design §3.1)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
rb-git.workspace = true
rb-model.workspace = true
rb-scip.workspace = true
rb-frameworks.workspace = true
rb-sql.workspace = true
rb-syntax.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
# The growth tests count operations in the packs and here (`rb_frameworks::work`).
rb-frameworks = { workspace = true, features = ["work-count"] }
# Encoding real `index.scip` bytes in the join's tests, so they run through `rb_scip::decode`
# (contract M3b amendment 59); the same pins as `rb-scip`.
protobuf.workspace = true
scip.workspace = true
tempfile.workspace = true

[lints]
workspace = true
