[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
gix = { version = "0.88", default-features = false, features = ["sha1", "revision"] }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rb-model = { path = "crates/rb-model" }
rb-git = { path = "crates/rb-git" }
rb-store = { path = "crates/rb-store" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
