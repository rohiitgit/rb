[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
gix = { version = "0.88", default-features = false, features = ["sha1", "revision"] }
roxmltree = "0.21"
toml = "1.1"
# Tree-sitter core and grammars (design §4.4). Versions are also pinned in rb-syntax's
# EXTRACTOR_VERSION, which a test checks against Cargo.lock.
tree-sitter = "0.27"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
# The real PostgreSQL parser (libpg_query, PG17), design §7.2.
pg_query = "6.2"
postgres = { version = "0.19", features = ["with-serde_json-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rb-api = { path = "crates/rb-api" }
rb-model = { path = "crates/rb-model" }
rb-git = { path = "crates/rb-git" }
rb-store = { path = "crates/rb-store" }
rb-indexer = { path = "crates/rb-indexer" }
rb-syntax = { path = "crates/rb-syntax" }
rb-sql = { path = "crates/rb-sql" }
rb-frameworks = { path = "crates/rb-frameworks" }
rb-scip = { path = "crates/rb-scip" }
rb-server = { path = "crates/rb-server" }
# SCIP index decoding (design §5.1). `scip` pins `protobuf = "=3.7.2"`; the same pin is needed
# here to name the `protobuf::Message` trait.
scip = "0.10"
protobuf = "=3.7.2"
# Content-addressed cache keys for SCIP indexes (design §5.2) must be collision-resistant.
sha2 = "0.10"
# `rb serve` (contract M5 D1, fork F1): HTTP/1.1 only, minimal features; `tokio` is already in the
# tree through `postgres`. The crate count and binary size were measured in phase 0 and again in
# phase 9 (CHANGELOG).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
